version: 2
updates:
  # Python：根目录 requirements.txt + requirements-*.lock
  # 注意：合并前需按 AGENTS.md 流程从 requirements-*.in 重新生成 lock，并运行依赖审计
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Bun workspace：根 bun.lock 统一覆盖 app/、web/、tauri/
  # 合并前需运行 npm run audit:dependencies（见 package.json）
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    groups:
      frontend:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Rust：Tauri 桌面 shell
  - package-ecosystem: cargo
    directory: /tauri/src-tauri
    schedule:
      interval: daily
    groups:
      rust:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Docker：根目录 Dockerfile + compose.yaml
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily

  # GitHub Actions：.github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
