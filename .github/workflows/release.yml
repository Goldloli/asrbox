name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.8"
  PYTHON_VERSION: "3.13"

jobs:
  macos-arm64:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node scripts/check-versions.mjs --tag "$INPUT_TAG"
          RELEASE_NOTES_PATH="docs/releases/${INPUT_TAG}.md"
          test -f "$RELEASE_NOTES_PATH" || { echo "Missing release notes: $RELEASE_NOTES_PATH"; exit 1; }
          printf 'RELEASE_TAG=%s\n' "$INPUT_TAG" >> "$GITHUB_ENV"
          printf 'RELEASE_NOTES_PATH=%s\n' "$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        run: npm run audit:dependencies

      - name: Test release tooling
        run: npm run test:release-tools

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pip==25.3
          .venv/bin/python -m pip install -r requirements-dev.lock -r requirements-build.lock

      - name: Verify vendored ffmpeg
        run: npm run verify:third-party

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web UI
        run: npm run build:web

      - name: Backend tests
        env:
          ASRBOX_FFMPEG_PATH: ${{ github.workspace }}/third_party/ffmpeg/darwin-arm64/ffmpeg
          ASRBOX_FFPROBE_PATH: ${{ github.workspace }}/third_party/ffmpeg/darwin-arm64/ffprobe
        run: npm run test:backend

      - name: Prepare Tauri sidecar placeholder
        run: bun run setup:dev

      - name: Cargo checks
        working-directory: tauri/src-tauri
        run: |
          cargo check --locked
          cargo test --locked

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Browser smoke test
        run: npm run test:e2e:smoke

      - name: Build desktop DMG
        run: npm run build:desktop

      - name: Frozen backend smoke test
        run: npm run test:backend:binary-smoke

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp tauri/src-tauri/target/release/bundle/dmg/ASRbox_*.dmg release-assets/
          ./scripts/prepare-ffmpeg-source.sh release-assets
          (cd release-assets && shasum -a 256 ./*.dmg ASRbox-ffmpeg-source-8.1.2.tar.gz > SHA256SUMS.txt)
          npm run verify:release-assets -- release-assets
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ASRbox ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            release-assets/*.dmg
            release-assets/ASRbox-ffmpeg-source-8.1.2.tar.gz
            release-assets/SHA256SUMS.txt
