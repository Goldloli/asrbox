name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.8"
  PYTHON_VERSION: "3.13"

jobs:
  macos-arm64:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Verify vendored ffmpeg
        run: |
          test -x third_party/ffmpeg/darwin-arm64/ffmpeg
          test -x third_party/ffmpeg/darwin-arm64/ffprobe
          third_party/ffmpeg/darwin-arm64/ffmpeg -version
          third_party/ffmpeg/darwin-arm64/ffprobe -version

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web UI
        run: npm run build:web

      - name: Build desktop DMG
        run: npm run build:desktop

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp tauri/src-tauri/target/release/bundle/dmg/ASRbox_*.dmg release-assets/
          shasum -a 256 release-assets/*.dmg > release-assets/SHA256SUMS.txt
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ASRbox ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
