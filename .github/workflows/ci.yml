name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.8"
  PYTHON_VERSION: "3.13"

jobs:
  checks:
    name: Typecheck, tests, and Rust checks
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check application versions
        run: npm run check:versions

      - name: Test release tooling
        run: npm run test:release-tools

      - name: Audit frontend dependencies
        run: npm run audit:dependencies

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pip==25.3
          .venv/bin/python -m pip install -r requirements-dev.lock

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web UI
        run: npm run build:web

      - name: Validate vendored ffmpeg
        run: npm run verify:third-party

      - name: Backend tests
        env:
          ASRBOX_FFMPEG_PATH: ${{ github.workspace }}/third_party/ffmpeg/darwin-arm64/ffmpeg
          ASRBOX_FFPROBE_PATH: ${{ github.workspace }}/third_party/ffmpeg/darwin-arm64/ffprobe
        run: npm run test:backend

      - name: Prepare Tauri sidecar placeholder
        run: bun run setup:dev

      - name: Cargo check
        working-directory: tauri/src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: tauri/src-tauri
        run: cargo test
