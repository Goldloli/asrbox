name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.8"
  PYTHON_VERSION: "3.13"
  PYTHON_VERSION_WINDOWS: "3.14"

jobs:
  checks:
    name: Typecheck, tests, and Rust checks
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check application versions
        run: npm run check:versions

      - name: Test release tooling
        run: npm run test:release-tools

      - name: Audit frontend dependencies
        run: npm run audit:dependencies

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pip==25.3
          .venv/bin/python -m pip install -r requirements-dev.lock

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test:frontend:unit

      - name: Build Web UI
        run: npm run build:web

      - name: Validate vendored ffmpeg
        run: npm run verify:third-party

      - name: Backend tests
        env:
          ASRBOX_FFMPEG_PATH: ${{ github.workspace }}/third_party/ffmpeg/darwin-arm64/ffmpeg
          ASRBOX_FFPROBE_PATH: ${{ github.workspace }}/third_party/ffmpeg/darwin-arm64/ffprobe
        run: npm run test:backend

      - name: Prepare Tauri sidecar placeholder
        run: bun run setup:dev

      - name: Cargo check
        working-directory: tauri/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: tauri/src-tauri
        run: cargo test --locked

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Maintained browser regression tests
        run: npm run test:e2e:maintained

  backend-windows:
    name: Backend tests on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION_WINDOWS }}

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install pip==25.3
          .venv/Scripts/python.exe -m pip install -r requirements-windows.lock

      - name: Fetch Windows ffmpeg binaries
        shell: bash
        run: ./scripts/fetch-ffmpeg-windows.sh

      - name: Validate vendored ffmpeg
        run: npm run verify:third-party

      - name: Backend tests
        env:
          ASRBOX_FFMPEG_PATH: ${{ github.workspace }}/third_party/ffmpeg/win32-x64/ffmpeg.exe
          ASRBOX_FFPROBE_PATH: ${{ github.workspace }}/third_party/ffmpeg/win32-x64/ffprobe.exe
        run: npm run test:backend

  docker:
    name: Docker build and deployment smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: asrbox:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker deployment
        env:
          ASRBOX_DOCKER_SKIP_BUILD: "1"
        run: npm run test:docker
