name: asrbox

services:
  asrbox:
    image: ${ASRBOX_IMAGE:-asrbox:local}
    build:
      context: .
      args:
        APP_VERSION: ${ASRBOX_VERSION:-0.2.0}
    ports:
      - "${ASRBOX_BIND_ADDRESS:-127.0.0.1}:${ASRBOX_PORT:-17494}:17494"
    environment:
      ASRBOX_DATA_DIR: /data
      ASRBOX_CONTAINER: "1"
      ASRBOX_PUBLIC_BIND_ADDRESS: ${ASRBOX_BIND_ADDRESS:-127.0.0.1}
      ASRBOX_API_TOKEN: ${ASRBOX_API_TOKEN:-}
      HF_HOME: /data/cache/huggingface
      HUGGINGFACE_HUB_CACHE: /data/cache/huggingface/hub
      MODELSCOPE_CACHE: /data/cache/modelscope
      TORCH_HOME: /data/cache/torch
      XDG_CACHE_HOME: /data/cache
      # Comma-separated container mount points shown by the Web model-storage selector.
      # After adding the optional bind mount below, use: /data,/model-storage
      ASRBOX_MODEL_STORAGE_ROOTS: ${ASRBOX_MODEL_STORAGE_ROOTS:-/data}
    volumes:
      - asrbox-data:/data
      # Optional large-model bind mount. Uncomment and set an absolute host path in .env:
      # - ${ASRBOX_MODEL_STORAGE_HOST_PATH:?set ASRBOX_MODEL_STORAGE_HOST_PATH}:/model-storage
      # Optional uploads bind mount for ingested media (browser uploads are always copied
      # into the container). Point it at a large external disk so media does not fill the
      # named volume, and set the host path in .env:
      #   macOS (external drive): ASRBOX_UPLOADS_HOST_PATH=/Volumes/<drive>/asrbox-uploads
      #   Windows (D: drive):     ASRBOX_UPLOADS_HOST_PATH=D:/asrbox-uploads
      # The host directory must be writable by container UID/GID 10001:10001.
      # Set this before the first ingest; media already stored in the named volume stays there.
      # - ${ASRBOX_UPLOADS_HOST_PATH:?set ASRBOX_UPLOADS_HOST_PATH}:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  asrbox-data:
    name: ${ASRBOX_DATA_VOLUME:-asrbox-data}
