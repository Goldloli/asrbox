# Windows x64 / Python 3.14 lock snapshot (runtime + dev in one file).
# Generated with `pip freeze` from the Windows 11 + Python 3.14 environment that
# passes the full backend suite. Dependency changes still start from
# requirements-runtime.in / requirements-dev.in; afterwards regenerate this file
# from a verified Windows environment.
# Windows uses Python 3.14 rather than the macOS 3.13 target: cancelling a
# mid-stream httpx request inside asyncio.run poisons subsequent connects on the
# Windows proactor loop for CPython 3.11/3.13 (verified empirically); 3.14
# behaves like POSIX. editdistance (funasr 1.3.14 dependency) also has no
# Windows wheel for 3.13+.
# Known divergence from requirements-runtime.lock (macOS Apple Silicon snapshot):
# funasr 1.4.15 vs 1.3.14 — 1.3.14 requires editdistance, which has no Windows
# wheel for Python 3.13+ and fails to compile under MSVC. The ASRbox model paths
# do not use it, matching the Linux CPU Docker lock which also omits it. Further
# routine pin drift: numpy 2.5.3 vs 2.4.6, onnxruntime 1.29.0 vs 1.27.0,
# modelscope 1.40.0 vs 1.38.0.
